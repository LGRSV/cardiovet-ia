<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atena</title>
<meta name="description" content="Tabulação e análise de fauna entomonecrófaga: coletas, triagem, índices e gráficos calculados no próprio aparelho.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Atena">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icones/icone-180.png">
<link rel="icon" type="image/svg+xml" href="icones/icone.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icones/icone-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo">
  <div class="marca"><img src="icones/icone-192.png" alt="" width="28" height="28"><div><strong>Atena</strong><span id="subtitulo">Fauna entomonecrófaga</span></div></div>
  <span id="selo-exemplo" class="selo" hidden>dados de exemplo</span>
</header>
<div class="conjuntos" role="group" aria-label="Conjunto de dados">
  <span>Conjunto</span>
  <button type="button" data-conjunto="piloto" aria-pressed="true">Piloto</button>
  <button type="button" data-conjunto="oficial" aria-pressed="false">Oficial</button>
</div>
<main id="tela" tabindex="-1"></main>
<nav class="abas" aria-label="Seções">
  <button data-aba="inicio" class="ativa"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Início</button>
  <button data-aba="coletas"><svg viewBox="0 0 24 24"><path d="M6 3h12v18H6zM9 8h6M9 12h6M9 16h4"/></svg>Coletas</button>
  <button data-aba="triagem"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 10a1.5 1.5 0 001.4 2h11.2a1.5 1.5 0 001.4-2l-5-10V3M8 15h8"/></svg>Triagem</button>
  <button data-aba="resultados"><svg viewBox="0 0 24 24"><path d="M4 20V4M4 20h16M8 16v-5M12 16V8M16 16v-3"/></svg>Resultados</button>
  <button data-aba="mais"><svg viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg>Mais</button>
</nav>
<dialog id="dialogo"><form method="dialog" id="formulario"></form></dialog>
<div id="dica" class="dica" hidden></div>
<div id="aviso" class="aviso" hidden role="status"></div>
<input type="file" id="arquivo" hidden accept=".json,.csv,.xlsx,application/json,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
<script src="calc.js"></script>
<script src="planilha.js"></script>
<script src="charts.js"></script>
<script src="exemplo.js"></script>
<script src="app.js"></script>
</body>
</html>
